[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recursieve"
version = "1.0.1"
description = "Iterative gene selection algorithm for single-cell group comparisons"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Kenny Pavan" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["single-cell", "scRNA-seq", "feature selection", "gene selection", "random forest", "anndata", "scanpy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "AnnSQL>=1.0.3",
  "anndata>=0.10",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ArpiarSaundersLab/RecurSieve"
Source = "https://github.com/ArpiarSaundersLab/RecurSieve"
Issues = "https://github.com/ArpiarSaundersLab/RecurSieve/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
